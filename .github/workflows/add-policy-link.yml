name: Add policy link

on:
  push:
    paths:
      - .github/workflows/add-policy-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add policy navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0;padding:7px', 'grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0;padding:7px', 1)
          s=s.replace('''    <button class="tab" data-tab="summaryPanel">半年まとめ</button>
    <button class="tab" data-tab="dataPanel">データ</button>''','''    <button class="tab" data-tab="summaryPanel">半年まとめ</button>
    <a class="tab" href="policy.html" style="text-decoration:none;text-align:center">育成方針</a>
    <button class="tab" data-tab="dataPanel">データ</button>''',1)
          p.write_text(s)
          if 'policy.html' not in s:
              raise SystemExit('policy link patch failed')
          PY
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-policy-link.yml
          git add index.html
          git commit -m "Link staff development policy page"
          git push
