name: Apply secure transfer patch

on:
  push:
    paths:
      - scripts/patch_transfer.py
      - .github/workflows/transfer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch app
        run: python scripts/patch_transfer.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/patch_transfer.py .github/workflows/transfer-patch.yml
          git add index.html
          git commit -m "Add secure cross-device transfer"
          git push
